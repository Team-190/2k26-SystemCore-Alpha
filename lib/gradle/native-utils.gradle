// Detect OS for FRC Natives
def osClassifier = {
    def osName = System.getProperty("os.name").toLowerCase()
    if (osName.contains("win")) return "windowsx86-64"
    if (osName.contains("mac")) return "osxuniversal"
    return "linuxx86-64"
}()

configurations {
    nativeDeps
}

dependencies {
    // Uses the version provider from your libs.versions.toml [cite: 4]
    def wpilibVer = libs.versions.wpilib.jni.get()
    // groupId is org.wpilib.* and the native artifact is a "-cpp" classified zip as of the
    // 2027 season (the old edu.wpi.first.*:*-jni jar coordinates no longer exist). The old
    // combined "-jni" jars used to bundle their native dependencies together; these granular
    // per-module zips don't, so hal-cpp's runtime dependencies on libwpinet.so and libdatalog.so
    // have to be pulled in explicitly too or extractNativeLibs's output is missing shared
    // libraries HAL needs to dlopen (confirmed via ldd on the extracted .so files).
    nativeDeps "org.wpilib.ntcore:ntcore-cpp:${wpilibVer}:${osClassifier}@zip"
    nativeDeps "org.wpilib.wpiutil:wpiutil-cpp:${wpilibVer}:${osClassifier}@zip"
    nativeDeps "org.wpilib.hal:hal-cpp:${wpilibVer}:${osClassifier}@zip"
    nativeDeps "org.wpilib.wpimath:wpimath-cpp:${wpilibVer}:${osClassifier}@zip"
    nativeDeps "org.wpilib.wpinet:wpinet-cpp:${wpilibVer}:${osClassifier}@zip"
    nativeDeps "org.wpilib.datalog:datalog-cpp:${wpilibVer}:${osClassifier}@zip"

    def phoenix6Ver = libs.versions.phoenix6.get()
    nativeDeps "com.ctre.phoenix6:tools:${phoenix6Ver}:${osClassifier}@zip"
    nativeDeps "com.ctre.phoenix6.sim:tools-sim:${phoenix6Ver}:${osClassifier}@zip"
    nativeDeps "com.ctre.phoenix6:api-cpp:${phoenix6Ver}:${osClassifier}@zip"
    nativeDeps "com.ctre.phoenix6.sim:api-cpp-sim:${phoenix6Ver}:${osClassifier}@zip"
}

def jniDestDir = layout.buildDirectory.dir("jni")

tasks.register('extractNativeLibs', Copy) {
    from {
        configurations.nativeDeps.collect { zipTree(it) }
    }
    into jniDestDir
    // Supports Windows (.dll), OSX (.dylib), and Linux (.so)
    include "**/*.so", "**/*.dll", "**/*.dylib"
    eachFile { path = name }
    includeEmptyDirs = false
}

// Ensure all test tasks depend on extraction and see the library path
tasks.withType(Test).configureEach {
    dependsOn extractNativeLibs
    // .get().asFile converts the DirectoryProperty to a standard File object
    systemProperty "java.library.path", jniDestDir.get().asFile.absolutePath
    systemProperty "jni.extract.path", jniDestDir.get().asFile.absolutePath
}
